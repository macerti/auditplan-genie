name: Déploiement — tools.macerti.com/auditplan

# Se déclenche à chaque push sur main (ex: merge d'une branche de travail),
# ou manuellement depuis l'onglet "Actions" de GitHub (bouton "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Annule un déploiement en cours si un nouveau push arrive entre-temps,
# pour éviter que deux déploiements ne s'entremêlent sur le serveur.
concurrency:
  group: auditplan-production-deploy
  cancel-in-progress: true

jobs:
  build-test-deploy:
    name: Build, tests, déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      # Le déploiement s'arrête ici si les tests du moteur de conformité
      # échouent — aucun code cassé n'atteint jamais tools.macerti.com.
      - name: Tests unitaires (moteur de conformité)
        run: npm run test

      - name: Build de production
        run: npm run build

      # IMPORTANT — sécurité :
      # - dangerous-clean-slate reste à "false" : cette action ne supprime
      #   JAMAIS de fichiers côté serveur qui ne sont pas dans dist/. Le
      #   véritable api/config.php (avec vos identifiants MariaDB réels)
      #   ne vit QUE sur le serveur, jamais dans ce dépôt Git — il est donc
      #   automatiquement ignoré et jamais écrasé ni supprimé.
      # - "exclude" ajoute une double protection explicite sur config.php,
      #   au cas où un futur commit l'ajouterait par erreur au dépôt.
      - name: Déploiement FTPS vers l'hébergement mutualisé
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21 # à adapter si votre hébergeur utilise un autre port FTPS
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          state-name: sql/.ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/config.php

      # Vérification informative uniquement — n'échoue jamais le workflow,
      # car un backend momentanément indisponible ne veut pas dire que le
      # déploiement des fichiers a échoué.
      - name: Vérification post-déploiement (health check)
        run: |
          echo "Contrôle de https://tools.macerti.com/auditplan/api/health.php"
          curl -sf https://tools.macerti.com/auditplan/api/health.php && echo || echo "⚠️ Health check injoignable ou en erreur — à vérifier manuellement (config.php peut ne pas être configuré côté serveur)."
        continue-on-error: true
